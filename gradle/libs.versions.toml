[versions]
ldq-jdbc-driver = "1.1.1"
java = "11"
shadow = "9.2.2"
trino = "476"
nimbusds = "10.5"
jackson = "2.21.7"
bouncycastle = "1.85"
junit = "5.9.0"
mockito = "5.21.0"
mockwebserver = "5.3.0"

[libraries]
trino-jdbc = { module = "io.trino:trino-jdbc", version.ref = "trino" }
nimbusds-jose-jwt = { module = "com.nimbusds:nimbus-jose-jwt", version.ref = "nimbusds" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
bouncycastle-bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
bouncycastle-bcpkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }
bouncycastle-bcpg = { module = "org.bouncycastle:bcpg-jdk18on", version.ref = "bouncycastle" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
jupiter-api = { module = "org.junit.jupiter:junit-jupiter" }
jupiter-params = { module = "org.junit.jupiter:junit-jupiter-params" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-junit-jupiter = { module = "org.mockito:mockito-junit-jupiter", version.ref = "mockito" }
mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "mockwebserver" }

[bundles]
bouncycastle = ["bouncycastle-bcprov", "bouncycastle-bcpkix", "bouncycastle-bcpg"]
jupiter = ["jupiter-api", "jupiter-params"]
mockito = ["mockito-core", "mockito-junit-jupiter"]

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
